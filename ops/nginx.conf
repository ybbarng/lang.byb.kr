# lang.byb.kr — 미리 그린 정적 파일(build/)을 내려주는 nginx 설정 (Dockerfile에서 /etc/nginx/conf.d/default.conf 로 쓴다).
# 앞단 Traefik이 TLS를 맡고, 이 컨테이너는 80번에서 평문으로 받는다.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml text/xml application/xml;

    # 파일 이름에 해시가 있는 빌드 산출물(JS·CSS): 1년, 바뀌지 않음
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 페이지(HTML): 배포하면 바로 새 버전. /french/numbers → french/numbers.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/index.html =404;
    }
}
